name: TrustPay full-stack checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test && npm run typecheck && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:i18n:e2e
        working-directory: frontend

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install with Python unavailable
        shell: pwsh
        working-directory: frontend
        run: |
          $nodeDirectory = Split-Path (Get-Command node).Source
          $env:Path = "$nodeDirectory;$env:WINDIR\System32;$env:WINDIR"
          if (Get-Command python -ErrorAction SilentlyContinue) { throw 'Python unexpectedly available on PATH' }
          # node-gyp also probes py.exe and fixed install paths; a missing forced Python makes any native build fail.
          $env:NODE_GYP_FORCE_PYTHON = 'C:\no-python\python.exe'
          npm ci
      - run: npm run test && npm run typecheck && npm run lint && npm run build
        working-directory: frontend

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - run: supabase start
      - run: supabase test db
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx vitest run src/lib/server/testing/disposable-db.test.ts
        working-directory: frontend
        env:
          TRUSTPAY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TRUSTPAY_TEST_CONFIRM: disposable
          # East of UTC, so a DATE converted through UTC would show the previous day.
          TZ: Asia/Nicosia
